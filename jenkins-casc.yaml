
jenkins:
  systemMessage: "Jenkins CI/CD - konfiguracja zarządzana przez JCasC"

  # Podstawowe ustawienia Jenkins
  numExecutors: 2
  mode: NORMAL

  scmCheckoutRetryCount: 3

  # Czas bezczynności agenta przed rozłączeniem (sekundy)
  remotingSecurity:
    enabled: true

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true

  # Konfiguracja narzędzi globalnych
  globalNodeProperties: []

  # Definicja narzędzi
  nodes: []

  # Konfiguracja pipeline
  projectNamingStrategy: "standard"

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "admin@example.com"

  # Timeout i ograniczenie czasu wykonywania pipeline
  buildDiscarders:
    configuredBuildDiscarders:
      - "jobBuildDiscarder"

  globalBuildDiscarderStrategy:
    buildDiscarders:
      - jobBuildDiscarder:
          strategy:
            logRotator:
              numToKeepStr: "10"
              daysToKeepStr: "30"

tool:
  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"

  nodejs:
    installations:
      - name: "NodeJS-22"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "22.14.0"
                    npmPackagesRefreshHours: 72

  # Docker jest zwykle instalowany na agencie.
  # Narzędzie Docker CLI nie jest instalowane przez JCasC.
  # Poniżej można zdefiniować jego ścieżkę na agencie.

  # Git jest wymagany do pobierania kodu
  git:
    installations:
      - name: "Default"
        home: "git"

# Konfiguracja przykładowego zadania Pipeline
jobs:
  - script: >
      pipelineJob('web-application-pipeline') {
        description('Przykładowy pipeline CI/CD dla aplikacji webowej')

        definition {
          cps {
            script("""
              pipeline {
                agent any

                tools {
                  maven 'Maven-3.9'
                  nodejs 'NodeJS-22'
                }

                options {
                  timeout(time: 30, unit: 'MINUTES')
                  buildDiscarder(
                    logRotator(
                      numToKeepStr: '10',
                      daysToKeepStr: '30'
                    )
                  )
                }

                stages {
                  stage('Checkout') {
                    steps {
                      git branch: 'main',
                          url: 'https://github.com/example/web-app.git'
                    }
                  }

                  stage('Build') {
                    steps {
                      sh 'mvn clean package'
                      sh 'npm install'
                      sh 'npm run build'
                    }
                  }

                  stage('Test') {
                    steps {
                      sh 'mvn test'
                      sh 'npm test'
                    }
                  }

                  stage('Docker Build') {
                    steps {
                      sh 'docker build -t web-app:latest .'
                    }
                  }

                  stage('Deploy Staging') {
                    steps {
                      echo 'Wdrożenie aplikacji na staging'
                    }
                  }

                  stage('Deploy Production') {
                    steps {
                      input message: 'Czy zatwierdzasz wdrożenie produkcyjne?',
                            ok: 'Deploy'
                      echo 'Wdrożenie aplikacji na produkcję'
                    }
                  }
                }

                post {
                  success {
                    echo 'Pipeline zakończony sukcesem!'
                  }
                  failure {
                    echo 'Pipeline zakończony błędem!'
                  }
                  always {
                    cleanWs()
                  }
                }
              }
            """.stripIndent())

            sandbox()
          }
        }
      }
